
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR | متجر العطور</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10100f;
      color: #f8f3e8;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #383226;
    }
    .logo {
      color: #d7b56d;
      font-size: 28px;
      letter-spacing: 5px;
      font-weight: bold;
    }
    header a { color: white; text-decoration: none; }
    .hero {
      padding: 75px 8%;
      text-align: center;
      background: radial-gradient(ellipse, #40341f, #10100f 70%);
    }
    .hero p { color: #c6bda9; }
    h1 { font-size: clamp(38px, 7vw, 70px); margin: 12px 0; }
    h1 span { color: #d7b56d; }
    .button {
      display: inline-block;
      padding: 13px 28px;
      background: #d7b56d;
      color: #15120b;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
    }
    .section { padding: 45px 8%; }
    .section h2 { text-align: center; color: #d7b56d; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
    .product {
      background: #1a1916;
      border: 1px solid #383226;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    .bottle {
      height: 155px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #302719, #171614);
      font-size: 65px;
      border-radius: 5px;
    }
    .product p { color: #bdb4a2; }
    .price { color: #d7b56d; font-size: 20px; }
    .product button { width: 100%; margin-top: 10px; }
    #cart {
      color: #d7b56d;
      font-weight: bold;
    }
    footer {
      padding: 28px;
      text-align: center;
      border-top: 1px solid #383226;
      color: #bdb4a2;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NOIR</div>
    <a href="#products">العطور</a>
    <div id="cart">السلة: 0</div>
  </header>

  <section class="hero">
    <p>عطور مختارة بعناية</p>
    <h1>اترك <span>أثراً</span> لا يُنسى</h1>
    <p>اكتشف عطرك، وخلّي حضورك يحچي عنك.</p>
    <a class="button" href="#products">اكتشف المجموعة</a>
  </section>

  <section class="section" id="products">
    <h2>مجموعة NOIR</h2>
    <p style="text-align:center;color:#bdb4a2">
      اكتشف مجموعتنا التجريبية من العطور
    </p>
    <div class="products" id="product-list"></div>
  </section>

  <footer>
    <div class="logo">NOIR</div>
    <p>الفخامة تبدأ من اختيارك.</p>
    <p>نموذج متجر تجريبي قابل للتخصيص</p>
  </footer>

  <script>
    const products = [
      { name: "NOIR OUD", desc: "نفحات عود دافئة", price: 35000, icon: "🖤" },
      { name: "GOLDEN AMBER", desc: "عنبر بلمسة فاخرة", price: 28000, icon: "✨" },
      { name: "MIDNIGHT", desc: "عطر للمساء", price: 32000, icon: "🌙" },
      { name: "ROYAL MUSK", desc: "مسك بنفحات ناعمة", price: 25000, icon: "🌟" }
    ];

    let cart = 0;
    const list = document.getElementById("product-list");

    products.forEach(product => {
      const card = document.createElement("article");
      card.className = "product";
      card.innerHTML = `
        <div class="bottle">${product.icon}</div>
        <h3>${product.name}</h3>
        <p>${product.desc}</p>
        <div class="price">${product.price.toLocaleString("en-US")} د.ع</div>
        <button class="button">أضف للسلة</button>
      `;
      card.querySelector("button").addEventListener("click", () => {
        cart++;
        document.getElementById("cart").textContent = "السلة: " + cart;
      });
      list.appendChild(card);
    });
  </script>
</body>
</html>
